name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Splits the
# 30-minute total budget across the 7 targets (~257 s each):
# chunk-stream reassembly, handshake, AMF0, AMF3, message-body
# decoders, FLV tags and the whole-session state machines (the last
# one over 127.0.0.1 sockets with OS-assigned ports).

on:
  schedule:
    - cron: "23 5 * * *"   # daily 05:23 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit

[package]
name = "oxideav-rtmp"
version = "0.0.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-rtmp"
homepage = "https://github.com/OxideAV/oxideav-rtmp"
authors = ["Mark Karpeles"]
description = "Pure-Rust RTMP (ingest + push) for oxideav — server accepts publishers, client pushes to remote servers, with a pluggable key-verification hook"
readme = "README.md"
keywords = ["multimedia", "rtmp", "streaming", "live", "pure-rust"]
categories = ["multimedia", "network-programming"]

[dependencies]
# Protocol layer is std-only (`std::net::TcpListener`, `std::thread::spawn`).
# `oxideav-core` is pulled in solely so we can implement the
# `PacketSource` trait the workspace's `SourceRegistry` consumes —
# a tiny dependency-light foundation crate, no third-party transitives.
oxideav-core = "0.1"
